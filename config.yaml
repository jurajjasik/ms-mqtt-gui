# Detector configuration - fully customizable
detector:
  topic_cmnd: "lqt/picoscope/cmnd/trigger_rate" # Topic for sending commands
  topic_response: "lqt/picoscope/statistics" # Topic for receiving responses
  topic_error: "lqt/picoscope/error/statistics" # Topic for error messages
  topic_settings_cmnd: "lqt/picoscope/cmnd/settings" # Topic for settings commands
  topic_settings_response: "lqt/picoscope/response/settings" # Topic for settings responses
  payload_key: "rms" # Key in payload JSON that contains the signal value
  use_confirmation: false # Enable/disable confirmation logic (set to false for listen-only mode)
  confirmation_timeout: 2 # Timeout in seconds for confirmation (only used if use_confirmation is true)

# Legacy detector configuration (deprecated, use 'detector' section above)
topic_base_detector: "lqt/picoscope"
device_name_detector: "trigger_rate"

topic_base_mass_filter: "lqt/qsource3"
device_name_mass_filter: "QSource3"

mqtt_broker: "147.231.28.79"
# mqtt_broker: "localhost"
mqtt_port: 1883
mqtt_connection_timeout: 60
